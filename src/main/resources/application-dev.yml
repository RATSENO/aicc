spring:
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    com.onestar.aicc: debug
    jdbc.sqlonly: info
    jdbc.resultsettable: off
    jdbc.audit: off
    jdbc.sqltiming: info
    jdbc.connection: off
